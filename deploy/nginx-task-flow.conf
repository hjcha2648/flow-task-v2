# Task Flow Web 서버(Nginx) 설정.
# 정적 파일은 /var/www/task-flow에서 제공하고 /api/ 요청만 App(127.0.0.1:8000)으로 넘긴다.
# 설치: sudo cp deploy/nginx-task-flow.conf /etc/nginx/sites-available/task-flow
#       sudo ln -sf /etc/nginx/sites-available/task-flow /etc/nginx/sites-enabled/task-flow

server {
    listen 80 default_server;
    server_name _;

    root /var/www/task-flow;
    index index.html;

    server_tokens off;
    # 할 일 요청 본문은 작으므로(제목 100자, 설명 2000자) 큰 요청을 막는다.
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /docs, /openapi.json 등 App의 다른 경로는 Web 서버에서 공개하지 않는다.
    location / {
        try_files $uri $uri/ =404;
        # 배포 후 브라우저가 예전 index.html과 새 app.js를 섞어 쓰지 않도록 매번 서버에 확인한다(변경 없으면 304).
        # location에서 add_header를 쓰면 server의 add_header가 상속되지 않으므로 다시 적는다.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
